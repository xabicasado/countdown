<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">Countdown</title>
    <meta name="description" content="It's the final one!" />
    <meta
      name="author"
      content="xabicasado <xabicasadonieto@gmail.com> (https://github.com/xabicasado)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="reset.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"
      defer
    ></script>
    <script src="./temporal-polifyll.js" defer></script>
    <script src="./i18n.js" defer></script>
    <script src="./main.js" defer></script>
  </head>

  <body>
    <header>
      <div class="color-picker">
        <fieldset>
          <legend class="visually-hidden" data-i18n="colorPicker"></legend>

          <label for="light" data-i18n="light" class="visually-hidden"></label>
          <input type="radio" name="theme" id="light" checked />

          <label for="dark" data-i18n="dark" class="visually-hidden"></label>
          <input type="radio" id="dark" name="theme" />
        </fieldset>
      </div>

      <div class="lang-switch">
        <label
          for="lang-select"
          data-i18n="langSwitch"
          class="visually-hidden"
        ></label>
        <select id="lang-select" class="lang-select">
          <option value="en" data-i18n="en"></option>
          <option value="es" data-i18n="es"></option>
          <option value="eu" data-i18n="eu"></option>
        </select>
      </div>
    </header>

    <main>
      <section id="countdown">
        <ul class="countdown-list" id="countdown-list"></ul>

        <template id="unit-template">
          <li class="countdown-unit">
            <span class="countdown-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label"></span>
          </li>
        </template>
      </section>
    </main>
  </body>
</html>
