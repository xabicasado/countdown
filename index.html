<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <meta name="description" content="It's the final one!" />
    <meta
      name="author"
      content="xabicasado <xabicasadonieto@gmail.com> (https://github.com/xabicasado)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="reset.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"
      defer
    ></script>
    <script src="./main.js" defer></script>
  </head>

  <body>
    <main>
      <section id="countdown" aria-labelledby="countdown-title">
        <ul class="countdown-list">
          <li class="countdown-unit" id="years-unit">
            <span class="countdown-digits" id="years-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">years</span>
          </li>

          <li class="countdown-unit" id="months-unit">
            <span class="countdown-digits" id="months-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">months</span>
          </li>

          <li class="countdown-unit" id="weeks-unit">
            <span class="countdown-digits" id="weeks-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">weeks</span>
          </li>

          <li class="countdown-unit" id="days-unit">
            <span class="countdown-digits" id="days-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">days</span>
          </li>

          <li class="countdown-unit" id="hours-unit">
            <span class="countdown-digits" id="hours-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">hours</span>
          </li>

          <li class="countdown-unit" id="minutes-unit">
            <span class="countdown-digits" id="minutes-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">minutes</span>
          </li>

          <li class="countdown-unit" id="seconds-unit">
            <span class="countdown-digits" id="seconds-digits">
              <span class="digit">0</span>
              <span class="digit">0</span>
            </span>
            <span class="countdown-label">seconds</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
